version: 2

project_name: wuu

builds:
  - main: ./cmd/wuu
    binary: wuu
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/blueberrycongee/wuu/internal/version.Version=v{{.Version}}
      - -X github.com/blueberrycongee/wuu/internal/version.Commit={{.ShortCommit}}
      - -X github.com/blueberrycongee/wuu/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: blueberrycongee
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/blueberrycongee/wuu"
    description: "AI coding agent for the terminal"
    binaries:
      - wuu
