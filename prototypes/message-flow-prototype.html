<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wuu Message Flow Prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f5f5f7;
        --surface: rgba(255, 255, 255, 0.82);
        --text: #1d1d1f;
        --muted: #75757a;
        --muted-2: #9a9aa0;
        --faint: #c7c7cc;
        --line: rgba(60, 60, 67, 0.14);
        --soft: rgba(60, 60, 67, 0.06);
        --soft-hover: rgba(60, 60, 67, 0.09);
        --accent: #007aff;
        --danger: #c53b3b;
        --danger-soft: #a64b4b;
        --code-bg: rgba(118, 118, 128, 0.09);
        --code-line: rgba(60, 60, 67, 0.12);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        --radius-control: 8px;
        --timing: cubic-bezier(0.2, 0, 0, 1);
        --sweep-duration: 3s;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #111113;
          --surface: rgba(28, 28, 30, 0.82);
          --text: #f5f5f7;
          --muted: #a6a6ad;
          --muted-2: #7d7d86;
          --faint: #5d5d66;
          --line: rgba(235, 235, 245, 0.14);
          --soft: rgba(235, 235, 245, 0.07);
          --soft-hover: rgba(235, 235, 245, 0.11);
          --danger: #ff6b65;
          --danger-soft: #ff8a82;
          --code-bg: rgba(235, 235, 245, 0.08);
          --code-line: rgba(235, 235, 245, 0.12);
          --shadow: 0 20px 70px rgba(0, 0, 0, 0.34);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 12% 0%, rgba(0, 122, 255, 0.08), transparent 28%),
          radial-gradient(circle at 95% 8%, rgba(88, 86, 214, 0.08), transparent 24%),
          var(--page);
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          Arial,
          sans-serif;
        letter-spacing: 0;
      }

      button,
      textarea {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        padding: 28px;
      }

      .shell {
        width: min(1180px, 100%);
        margin: 0 auto;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }

      .debug-panel,
      .conversation-shell {
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .debug-panel {
        position: sticky;
        top: 28px;
        border-radius: 18px;
        padding: 16px;
      }

      .debug-title {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 650;
      }

      .debug-note {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .debug-actions {
        display: grid;
        gap: 8px;
      }

      .debug-section {
        margin: 16px 0 0;
        padding: 14px 0 0;
        border-top: 1px solid var(--line);
      }

      .debug-section-title {
        margin: 0 0 10px;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
      }

      .control-stack {
        display: grid;
        gap: 12px;
      }

      .control-row {
        display: grid;
        gap: 6px;
      }

      .control-row-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .control-row label,
      .toggle-row span {
        color: var(--muted);
        font-size: 12px;
      }

      .control-row output {
        color: var(--text);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .control-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .toggle-row input {
        accent-color: var(--accent);
      }

      .debug-actions button,
      .choice-button,
      .copy-button {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--text);
        border-radius: var(--radius-control);
        cursor: pointer;
        transition:
          background 160ms var(--timing),
          border-color 160ms var(--timing),
          transform 160ms var(--timing);
      }

      .debug-actions button {
        min-height: 34px;
        padding: 7px 10px;
        text-align: left;
        font-size: 13px;
      }

      .debug-actions button:hover,
      .choice-button:hover,
      .copy-button:hover {
        background: var(--soft-hover);
        border-color: color-mix(in srgb, var(--line) 60%, var(--muted));
      }

      .debug-actions button:active,
      .choice-button:active,
      .copy-button:active {
        transform: scale(0.99);
      }

      .constraint-list {
        margin: 16px 0 0;
        padding: 12px 0 0;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .constraint-list strong {
        color: var(--text);
        font-weight: 600;
      }

      .conversation-shell {
        border-radius: 22px;
        min-height: 780px;
        overflow: hidden;
      }

      .conversation-header {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
      }

      .conversation-header strong {
        font-size: 14px;
        font-weight: 650;
      }

      .conversation-header span {
        color: var(--muted);
        font-size: 12px;
      }

      .conversation {
        width: min(760px, calc(100% - 48px));
        margin: 0 auto;
        padding: 38px 0 80px;
      }

      .turn {
        display: grid;
        gap: 18px;
      }

      .user-message-block {
        display: flex;
        justify-content: flex-end;
      }

      .user-message {
        max-width: min(560px, 86%);
        padding: 10px 13px;
        border-radius: 15px;
        background: var(--soft);
        color: var(--text);
        font-size: 14px;
        line-height: 1.58;
      }

      .process {
        margin: 2px 0 0;
        color: var(--muted);
      }

      .process-toggle {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 26px;
        cursor: pointer;
        text-align: left;
      }

      .process-toggle:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent), transparent 38%);
        outline-offset: 3px;
        border-radius: var(--radius-control);
      }

      .status-viewport {
        display: inline-grid;
        grid-template-areas: "stack";
        align-items: center;
        min-width: 0;
        height: 1.4em;
        overflow: hidden;
        font-size: 13px;
        font-weight: 540;
      }

      .state-label {
        grid-area: stack;
        display: inline-block;
        position: relative;
        white-space: nowrap;
      }

      .state-label.running {
        color: color-mix(in srgb, var(--muted), var(--text) 14%);
      }

      .state-label.running::after {
        content: attr(data-label);
        position: absolute;
        inset: 0;
        color: transparent;
        background:
          linear-gradient(
            100deg,
            transparent 0%,
            transparent 28%,
            color-mix(in srgb, var(--text) 70%, var(--accent) 30%) 43%,
            color-mix(in srgb, var(--text) 92%, white 8%) 50%,
            color-mix(in srgb, var(--text) 70%, var(--accent) 30%) 57%,
            transparent 72%,
            transparent 100%
          );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: textSweep var(--sweep-duration) ease-in-out infinite;
      }

      .state-label.failed {
        color: var(--danger);
      }

      .state-label.waiting {
        color: color-mix(in srgb, var(--text), var(--accent) 22%);
      }

      .state-label.entering {
        animation: stateTextIn 220ms var(--timing) both;
      }

      .state-label.leaving {
        animation: stateTextOut 180ms var(--timing) both;
      }

      .process-meta {
        color: var(--muted-2);
        font-size: 13px;
        white-space: nowrap;
      }

      .chevron {
        margin-left: auto;
        color: var(--muted-2);
        font-size: 14px;
        line-height: 1;
        transform: rotate(0deg);
        transition: transform 220ms var(--timing);
      }

      .process.expanded .chevron {
        transform: rotate(90deg);
      }

      .process-details {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition:
          grid-template-rows 260ms var(--timing),
          opacity 180ms var(--timing);
      }

      .process.expanded .process-details {
        grid-template-rows: 1fr;
        opacity: 1;
      }

      .process-details-inner {
        overflow: hidden;
      }

      .process-list {
        padding: 7px 0 2px 18px;
        display: grid;
        gap: 5px;
      }

      .process-item {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        opacity: 0;
        transform: translateY(3px);
        animation: processItemIn 240ms var(--timing) forwards;
      }

      .process-item.thought {
        max-width: 660px;
        color: color-mix(in srgb, var(--muted), var(--text) 8%);
      }

      .process-item.action {
        color: var(--muted-2);
      }

      .process-item.error {
        color: var(--danger-soft);
      }

      .choice-inline {
        margin-top: 4px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .choice-button {
        min-height: 30px;
        padding: 5px 10px;
        font-size: 12px;
        color: var(--text);
      }

      .final-text {
        max-width: 720px;
        min-height: 1px;
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.72;
      }

      .final-block {
        opacity: 0;
        transform: translateY(3px);
        animation: finalBlockIn 240ms var(--timing) forwards;
      }

      .semantic-block {
        opacity: 0;
        transform: translateY(5px);
        filter: blur(2px);
        animation: semanticBlockIn 420ms var(--timing) forwards;
      }

      .stream-tail {
        display: inline;
        border-radius: 3px;
      }

      .stream-tail.soft-append {
        animation: streamSoftAppend 240ms var(--timing) both;
      }

      .stream-tail.text-mask {
        color: transparent;
        background:
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--text), transparent 74%) 0%,
            var(--text) 42%,
            color-mix(in srgb, var(--text), var(--accent) 18%) 58%,
            transparent 100%
          );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: streamTextMask 520ms var(--timing) both;
      }

      .stream-tail.tail-glow {
        color: color-mix(in srgb, var(--text), var(--accent) 16%);
        text-shadow: 0 0 10px color-mix(in srgb, var(--accent), transparent 58%);
        animation: streamTailGlow 520ms var(--timing) both;
      }

      .stream-tail.muted-solid {
        animation: streamMutedSolid 520ms var(--timing) both;
      }

      .stream-tail.ink-reveal {
        animation: streamInkReveal 360ms var(--timing) both;
      }

      .final-text.line-settle-streaming > :last-child {
        color: color-mix(in srgb, var(--text), var(--muted) 34%);
        transform: translateY(1px);
        transition:
          color 360ms var(--timing),
          transform 360ms var(--timing);
      }

      .final-text p {
        margin: 0 0 12px;
      }

      .final-text > :first-child {
        margin-top: 0;
      }

      .final-text.is-streaming:not(.semantic-streaming) > * {
        animation: none;
      }

      .final-text h2,
      .final-text h3 {
        margin: 20px 0 8px;
        font-size: 15.5px;
        line-height: 1.4;
        font-weight: 650;
        letter-spacing: 0;
      }

      .final-text ul,
      .final-text ol {
        margin: 0 0 13px;
        padding-left: 20px;
      }

      .final-text li {
        margin: 3px 0;
      }

      .final-text blockquote {
        margin: 14px 0;
        padding: 0 0 0 12px;
        border-left: 2px solid var(--line);
        color: var(--muted);
      }

      .code-card,
      .table-wrap {
        border: 1px solid var(--code-line);
        background: var(--code-bg);
        border-radius: 10px;
        overflow: hidden;
        margin: 14px 0;
      }

      .code-toolbar {
        min-height: 32px;
        padding: 0 10px;
        border-bottom: 1px solid var(--code-line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }

      .copy-button {
        min-height: 24px;
        padding: 3px 8px;
        opacity: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .code-card:hover .copy-button,
      .code-card:focus-within .copy-button {
        opacity: 1;
      }

      .final-text.is-streaming .copy-button,
      .final-text.is-streaming .code-card:hover .copy-button,
      .final-text.is-streaming .code-card:focus-within .copy-button {
        opacity: 0;
        pointer-events: none;
        transition: none;
      }

      pre {
        margin: 0;
        padding: 13px 14px 15px;
        overflow-x: auto;
      }

      code,
      pre {
        font-family:
          "SF Mono",
          ui-monospace,
          Menlo,
          Consolas,
          monospace;
        font-size: 12.5px;
        line-height: 1.62;
      }

      .inline-code {
        font-family:
          "SF Mono",
          ui-monospace,
          Menlo,
          Consolas,
          monospace;
        font-size: 0.92em;
        color: color-mix(in srgb, var(--text), var(--accent) 16%);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--code-line);
        text-align: left;
        vertical-align: top;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      th {
        color: var(--muted);
        font-weight: 600;
      }

      .empty-hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      @keyframes textSweep {
        0% {
          background-position: 160% 0;
          opacity: 0;
        }
        18% {
          opacity: 0;
        }
        38% {
          opacity: 1;
        }
        82% {
          opacity: 1;
        }
        100% {
          background-position: -160% 0;
          opacity: 0;
        }
      }

      @keyframes stateTextIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes stateTextOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-5px);
        }
      }

      @keyframes processItemIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes finalBlockIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes semanticBlockIn {
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes streamSoftAppend {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes streamTextMask {
        from {
          background-position: 130% 0;
          opacity: 0.42;
        }
        to {
          background-position: 0 0;
          opacity: 1;
        }
      }

      @keyframes streamTailGlow {
        0% {
          opacity: 0.45;
          text-shadow: 0 0 0 color-mix(in srgb, var(--accent), transparent 100%);
        }
        45% {
          opacity: 1;
          text-shadow: 0 0 11px color-mix(in srgb, var(--accent), transparent 52%);
        }
        100% {
          opacity: 1;
          text-shadow: 0 0 4px color-mix(in srgb, var(--accent), transparent 82%);
        }
      }

      @keyframes streamMutedSolid {
        from {
          color: var(--muted);
        }
        to {
          color: var(--text);
        }
      }

      @keyframes streamInkReveal {
        from {
          opacity: 0;
          filter: blur(3px);
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }

      @media (max-width: 900px) {
        .app {
          padding: 16px;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .debug-panel {
          position: static;
        }

        .debug-actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .conversation-shell {
          min-height: 680px;
        }

        .conversation {
          width: min(100% - 32px, 760px);
          padding-top: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="shell">
        <aside class="debug-panel" aria-label="消息流调试按钮">
          <h1 class="debug-title">消息流原型</h1>
          <p class="debug-note">调试按钮会模拟真实 turn：运行中展开过程，完成后折叠，只突出最后一段 final text。</p>
          <div class="debug-actions">
            <button type="button" data-run="success">播放完整成功流</button>
            <button type="button" data-run="semantic">播放语义块渐显流</button>
            <button type="button" data-run="soft-append">Soft Append 流式</button>
            <button type="button" data-run="text-mask">Text Mask Reveal</button>
            <button type="button" data-run="tail-glow">Tail Glow 流式</button>
            <button type="button" data-run="muted-solid">Muted To Solid</button>
            <button type="button" data-run="line-settle">Line Settle</button>
            <button type="button" data-run="ink-reveal">Ink Reveal</button>
            <button type="button" data-run="waiting">模拟等待用户选择</button>
            <button type="button" data-run="failed">模拟处理失败</button>
            <button type="button" data-run="stopped">模拟中途停止</button>
            <button type="button" data-run="completed">加载完成态</button>
            <button type="button" data-run="toggle">展开/收起过程</button>
            <button type="button" data-run="reset">重置</button>
          </div>
          <div class="debug-section" aria-label="模拟参数">
            <h2 class="debug-section-title">参数</h2>
            <div class="control-stack">
              <div class="control-row">
                <div class="control-row-header">
                  <label for="tokenRate">token 速率</label>
                  <output id="tokenRateValue" for="tokenRate">22 token/s</output>
                </div>
                <input id="tokenRate" type="range" min="3" max="80" step="1" value="22" />
              </div>
              <div class="control-row">
                <div class="control-row-header">
                  <label for="stepSpeed">过程步进速度</label>
                  <output id="stepSpeedValue" for="stepSpeed">1.0x</output>
                </div>
                <input id="stepSpeed" type="range" min="0.35" max="2.5" step="0.05" value="1" />
              </div>
              <div class="control-row">
                <div class="control-row-header">
                  <label for="sweepSpeed">文字扫光周期</label>
                  <output id="sweepSpeedValue" for="sweepSpeed">3.0s</output>
                </div>
                <input id="sweepSpeed" type="range" min="1.6" max="5" step="0.1" value="3" />
              </div>
              <label class="toggle-row">
                <span>完成后自动折叠过程</span>
                <input id="autoCollapse" type="checkbox" checked />
              </label>
            </div>
          </div>
          <div class="constraint-list">
            <strong>已编码约束：</strong><br />
            final text 无容器；过程无背景；运行态文字慢扫光；支持 token 流式、语义块渐显和 6 种前端文字动效对比；运行中过程展开；完成后过程折叠；思考是过程正文；工具是动作行；代码块保留轻容器。
          </div>
        </aside>

        <section class="conversation-shell" aria-label="消息流预览">
          <header class="conversation-header">
            <strong>中间消息流</strong>
            <span>Apple-like text-first prototype</span>
          </header>
          <div class="conversation">
            <article class="turn" id="turn">
              <div class="empty-hint" id="emptyHint">点击左侧调试按钮开始模拟。</div>
            </article>
          </div>
        </section>
      </div>
    </main>

    <script>
      const turn = document.querySelector("#turn");
      const buttons = document.querySelectorAll("[data-run]");
      const tokenRateControl = document.querySelector("#tokenRate");
      const stepSpeedControl = document.querySelector("#stepSpeed");
      const sweepSpeedControl = document.querySelector("#sweepSpeed");
      const autoCollapseControl = document.querySelector("#autoCollapse");
      const tokenRateValue = document.querySelector("#tokenRateValue");
      const stepSpeedValue = document.querySelector("#stepSpeedValue");
      const sweepSpeedValue = document.querySelector("#sweepSpeedValue");

      let timers = [];
      let ticker = 0;
      let startedAt = 0;
      let elapsedOverride = null;
      let processExpanded = true;
      let processItemCount = 0;
      let runID = 0;

      const wait = (ms) => new Promise((resolve) => {
        const timer = window.setTimeout(resolve, ms);
        timers.push(timer);
      });

      const successMarkdown = [

      function clearTimers() {
        for (const timer of timers) {
          window.clearTimeout(timer);
        }
        timers = [];
        if (ticker) {
          window.clearInterval(ticker);

      function currentTokenRate() {
        return Math.max(1, Number(tokenRateControl?.value ?? 22));
      }

      function currentStepSpeed() {
        return Math.max(0.1, Number(stepSpeedControl?.value ?? 1));
      }

      function waitStep(ms) {
        return wait(ms / currentStepSpeed());
      }

      function syncControls() {
        const tokenRate = currentTokenRate();
        const stepSpeed = currentStepSpeed();
        const sweepSpeed = Math.max(0.5, Number(sweepSpeedControl?.value ?? 3));
        if (tokenRateValue) {
          tokenRateValue.textContent = `${tokenRate} token/s`;
        }
        if (stepSpeedValue) {

        }
        if (sweepSpeedValue) {

        }
        document.documentElement.style.setProperty("--sweep-duration", `${sweepSpeed}s`);
      }

      function startTicker() {

      function updateMeta() {
        const meta = document.querySelector("#processMeta");
        if (!meta || !startedAt) {
          return;
        }
        const elapsed = elapsedOverride ?? Math.max(0, Math.round((Date.now() - startedAt) / 1000));
        if (isCompleted()) {
          meta.textContent = `· ${processItemCount} 项 · ${elapsed}s`;
          return;
        }
        meta.textContent = `· ${elapsed}s`;
      }

      function isCompleted() {
        const process = document.querySelector("#process");
        return Boolean(process?.classList.contains("completed") || process?.classList.contains("stopped") || process?.classList.contains("failed"));
      }

      function setStatus(text, mode) {
        const viewport = document.querySelector("#statusViewport");
        if (!viewport) {
          return;
        }
        const current = viewport.querySelector(".state-label.current");
        if (current && current.dataset.label === text && current.dataset.mode === mode) {
          return;
        }
        if (current) {
          current.classList.remove("current", "entering");
          current.classList.add("leaving");
          window.setTimeout(() => current.remove(), 190);
        }
        const next = document.createElement("span");
        next.className = `state-label current entering ${mode || ""}`.trim();
        next.textContent = text;
        next.dataset.label = text;
        next.dataset.mode = mode || "";
        viewport.appendChild(next);
      }

      function toggleProcess() {
        const process = document.querySelector("#process");
        const toggle = document.querySelector("#processToggle");
        if (!process || !toggle) {
          return;
        }
        processExpanded = !process.classList.contains("expanded");
        process.classList.toggle("expanded", processExpanded);
        toggle.setAttribute("aria-expanded", String(processExpanded));
      }

      function setProcessExpanded(expanded) {
        const process = document.querySelector("#process");
        const toggle = document.querySelector("#processToggle");
        if (!process || !toggle) {

      function addProcessItem(kind, text, extraHTML = "") {

      function completeProcess({ status = "completed", elapsed = 18 } = {}) {
        const process = document.querySelector("#process");
        if (!process) {
          return;

        elapsedOverride = elapsed;
        process.classList.remove("running", "waiting");
        process.classList.add(status);
        if (status === "completed") {
          setStatus("过程记录", "");
          setProcessExpanded(Boolean(autoCollapseControl?.checked) ? false : processExpanded);
        } else if (status === "stopped") {
          setStatus("已停止", "");
          setProcessExpanded(Boolean(autoCollapseControl?.checked) ? false : processExpanded);
        } else if (status === "failed") {
          setStatus("处理失败", "failed");
          setProcessExpanded(true);
        }
        updateMeta();
        if (ticker && status !== "failed") {
          window.clearInterval(ticker);
          ticker = 0;
        }
      }

      function isActiveRun(id) {
        return id === runID;
      }

      async function streamFinalMarkdown(markdown, id, effect = "token") {
        const finalText = document.querySelector("#finalText");
        if (!finalText) {
          return;
        }
        finalText.classList.remove("semantic-streaming", "line-settle-streaming");
        finalText.classList.add("is-streaming");
        if (effect === "line-settle") {
          finalText.classList.add("line-settle-streaming");
        }
        let buffer = "";
        const tokens = tokenizeStream(markdown);
        for (const token of tokens) {
          if (!isActiveRun(id)) {
            return;
          }
          buffer += token;
          renderFinalMarkdown(buffer, effect);
          await wait(1000 / currentTokenRate());
        }
        finalText.classList.remove("is-streaming", "line-settle-streaming");
        renderFinalMarkdown(markdown);
      }

      async function streamFinalSemantic(markdown, id) {
        const finalText = document.querySelector("#finalText");
        if (!finalText) {
          return;
        }
        finalText.classList.add("is-streaming", "semantic-streaming");
        finalText.innerHTML = "";
        const blocks = splitMarkdownBlocks(markdown);
        for (const block of blocks) {
          if (!isActiveRun(id)) {
            return;
          }
          appendSemanticBlock(renderMarkdown(block));
          const tokenCount = Math.max(1, tokenizeStream(block).filter((token) => token.trim()).length);
          const delay = Math.min(900, Math.max(180, (tokenCount / currentTokenRate()) * 1000));
          await wait(delay);
        }
        finalText.classList.remove("is-streaming", "semantic-streaming");
      }

      function appendSemanticBlock(html) {
        const finalText = document.querySelector("#finalText");
        if (!finalText || !html.trim()) {
          return;
        }
        const block = document.createElement("div");
        block.className = "final-block semantic-block";
        block.innerHTML = html;
        finalText.appendChild(block);
      }

      function splitMarkdownBlocks(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const blocks = [];
        let index = 0;
        while (index < lines.length) {
          if (/^\s*$/.test(lines[index])) {
            index += 1;
            continue;
          }

          if (/^```/.test(lines[index])) {
            const block = [lines[index]];
            index += 1;
            while (index < lines.length) {
              block.push(lines[index]);
              const done = /^```/.test(lines[index]);
              index += 1;
              if (done) {
                break;
              }
            }
            blocks.push(block.join("\n"));
            continue;
          }

          if (isTableStart(lines, index)) {
            const block = [lines[index], lines[index + 1]];
            index += 2;
            while (index < lines.length && /\|/.test(lines[index]) && !/^\s*$/.test(lines[index])) {
              block.push(lines[index]);
              index += 1;
            }
            blocks.push(block.join("\n"));
            continue;
          }

          if (/^(#{1,6})\s+/.test(lines[index])) {
            blocks.push(lines[index]);
            index += 1;
            continue;
          }

          if (/^>\s?/.test(lines[index])) {
            const block = [];
            while (index < lines.length && /^>\s?/.test(lines[index])) {
              block.push(lines[index]);
              index += 1;
            }
            blocks.push(block.join("\n"));
            continue;
          }

          if (/^\s*((?:[-*])|(?:\d+\.))\s+/.test(lines[index])) {
            const first = lines[index].match(/^\s*((?:[-*])|(?:\d+\.))\s+/);
            const ordered = Boolean(first && /\d+\./.test(first[1]));
            const block = [];
            while (index < lines.length) {
              const item = lines[index].match(/^\s*((?:[-*])|(?:\d+\.))\s+/);
              if (!item || /\d+\./.test(item[1]) !== ordered) {
                break;
              }
              block.push(lines[index]);
              index += 1;
            }
            blocks.push(block.join("\n"));
            continue;
          }

          const block = [lines[index]];
          index += 1;
          while (
            index < lines.length &&
            !/^\s*$/.test(lines[index]) &&
            !/^```/.test(lines[index]) &&
            !/^(#{1,6})\s+/.test(lines[index]) &&
            !/^>\s?/.test(lines[index]) &&
            !/^\s*((?:[-*])|(?:\d+\.))\s+/.test(lines[index]) &&
            !isTableStart(lines, index)
          ) {
            block.push(lines[index]);
            index += 1;
          }
          blocks.push(block.join("\n"));
        }
        return blocks;
      }

      function renderFinalMarkdown(markdown, effect = "token") {
        const finalText = document.querySelector("#finalText");
        if (!finalText) {
          return;
        }
        finalText.innerHTML = renderMarkdown(markdown);
        decorateStreamEffect(finalText, effect);
      }

      function decorateStreamEffect(root, effect) {
        if (effect === "token" || effect === "line-settle") {
          return;
        }
        const textNode = latestDecoratableTextNode(root);
        if (!textNode || !textNode.nodeValue) {
          return;
        }
        const raw = textNode.nodeValue;
        const trimmedEnd = raw.search(/\s*$/);
        const end = trimmedEnd < 0 ? raw.length : trimmedEnd;
        if (end <= 0) {
          return;
        }
        const length = effect === "tail-glow" ? 16 : effect === "text-mask" ? 24 : 10;
        const start = Math.max(0, end - length);
        const before = raw.slice(0, start);
        const tail = raw.slice(start, end);
        const after = raw.slice(end);
        const parent = textNode.parentNode;
        if (!parent || !tail) {
          return;
        }
        const span = document.createElement("span");
        span.className = `stream-tail ${effect}`;
        span.textContent = tail;
        const fragment = document.createDocumentFragment();
        if (before) {
          fragment.appendChild(document.createTextNode(before));
        }
        fragment.appendChild(span);
        if (after) {
          fragment.appendChild(document.createTextNode(after));
        }
        parent.replaceChild(fragment, textNode);
      }

      function latestDecoratableTextNode(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            const text = node.nodeValue ?? "";
            const parent = node.parentElement;
            if (!text.trim() || !parent) {
              return NodeFilter.FILTER_REJECT;
            }
            if (parent.closest("code, pre, .code-card, .table-wrap, .copy-button")) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        let current = walker.nextNode();
        let latest = null;
        while (current) {
          latest = current;
          current = walker.nextNode();
        }
        return latest;
      }

      function tokenizeStream(text) {
        const tokens = text.match(/[\u4e00-\u9fff]|[A-Za-z0-9_]+|[^\sA-Za-z0-9_\u4e00-\u9fff]|\s+/gu);
        return tokens ?? [];
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const out = [];
        let index = 0;
        while (index < lines.length) {
          const line = lines[index];
          if (/^\s*$/.test(line)) {
            index += 1;
            continue;
          }

          const fence = line.match(/^```([\w-]*)/);
          if (fence) {
            const language = fence[1] || "text";
            const code = [];
            index += 1;
            while (index < lines.length && !/^```/.test(lines[index])) {
              code.push(lines[index]);
              index += 1;
            }
            if (index < lines.length && /^```/.test(lines[index])) {
              index += 1;
            }
            out.push(renderCodeCard(language, code.join("\n")));
            continue;
          }

          if (isTableStart(lines, index)) {
            const headers = splitTableCells(lines[index]);
            index += 2;
            const rows = [];
            while (index < lines.length && /\|/.test(lines[index]) && !/^\s*$/.test(lines[index])) {
              rows.push(splitTableCells(lines[index]));
              index += 1;
            }
            out.push(renderTable(headers, rows));
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            out.push(`<h2>${renderInline(heading[2])}</h2>`);
            index += 1;
            continue;
          }

          if (/^>\s?/.test(line)) {
            const quote = [];
            while (index < lines.length && /^>\s?/.test(lines[index])) {
              quote.push(lines[index].replace(/^>\s?/, ""));
              index += 1;
            }
            out.push(`<blockquote>${quote.map(renderInline).join("<br />")}</blockquote>`);
            continue;
          }

          const listMatch = line.match(/^\s*((?:[-*])|(?:\d+\.))\s+(.+)$/);
          if (listMatch) {
            const ordered = /\d+\./.test(listMatch[1]);
            const items = [];
            while (index < lines.length) {
              const itemMatch = lines[index].match(/^\s*((?:[-*])|(?:\d+\.))\s+(.+)$/);
              if (!itemMatch || /\d+\./.test(itemMatch[1]) !== ordered) {
                break;
              }
              items.push(itemMatch[2]);
              index += 1;
            }
            const tag = ordered ? "ol" : "ul";
            out.push(`<${tag}>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</${tag}>`);
            continue;
          }

          const paragraph = [line];
          index += 1;
          while (
            index < lines.length &&
            !/^\s*$/.test(lines[index]) &&
            !/^```/.test(lines[index]) &&
            !/^(#{1,6})\s+/.test(lines[index]) &&
            !/^>\s?/.test(lines[index]) &&
            !/^\s*((?:[-*])|(?:\d+\.))\s+/.test(lines[index]) &&
            !isTableStart(lines, index)
          ) {
            paragraph.push(lines[index]);
            index += 1;
          }
          out.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
        }
        return out.join("");
      }

      function isTableStart(lines, index) {
        return Boolean(lines[index]?.includes("|") && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1] ?? ""));
      }

      function splitTableCells(line) {
        let value = line.trim();
        if (value.startsWith("|")) {
          value = value.slice(1);
        }
        if (value.endsWith("|")) {
          value = value.slice(0, -1);
        }
        return value.split("|").map((cell) => cell.trim());
      }

      function renderTable(headers, rows) {
        const head = headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("");
        const body = rows
          .map((row) => `<tr>${headers.map((_, cellIndex) => `<td>${renderInline(row[cellIndex] ?? "")}</td>`).join("")}</tr>`)
          .join("");
        return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
      }

      function renderCodeCard(language, code) {
        return `
          <div class="code-card">
            <div class="code-toolbar"><span>${escapeHTML(language || "text")}</span><button class="copy-button" type="button">复制</button></div>
            <pre><code>${escapeHTML(code)}</code></pre>
          </div>
        `;
      }

      function renderInline(text) {
        return String(text)
          .split(/(`[^`]*`)/g)
          .map((part) => {
            if (part.startsWith("`") && part.endsWith("`") && part.length >= 2) {
              return `<span class="inline-code">${escapeHTML(part.slice(1, -1))}</span>`;
            }
            return escapeHTML(part).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          })
          .join("");
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      document.addEventListener("click", (event) => {
        const button = event.target instanceof Element ? event.target.closest(".copy-button") : null;
        if (!button) {
          return;
        }
        const code = button.closest(".code-card")?.querySelector("code")?.textContent ?? "";
        if (!code) {
          return;
        }
        void navigator.clipboard?.writeText(code);
        button.textContent = "已复制";
        window.setTimeout(() => {
          button.textContent = "复制";
        }, 900);
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const run = button.dataset.run;
          if (run === "success") {
            void runSuccess();
          } else if (run === "semantic") {
            void runSemanticReveal();
          } else if (
            run === "soft-append" ||
            run === "text-mask" ||
            run === "tail-glow" ||
            run === "muted-solid" ||
            run === "line-settle" ||
            run === "ink-reveal"
          ) {
            void runEffectDemo(run);
          } else if (run === "waiting") {
            void runWaiting();
          } else if (run === "failed") {
            void runFailed();
          } else if (run === "stopped") {
            void runStopped();
          } else if (run === "completed") {
            loadCompleted();
          } else if (run === "toggle") {
            toggleProcess();
          } else {
            resetTurn();
          }
        });
      });

      [tokenRateControl, stepSpeedControl, sweepSpeedControl].forEach((control) => {
        control?.addEventListener("input", syncControls);
      });
      syncControls();
    </script>
  </body>
</html>
