name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  cli:
    name: CLI archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          core_version="$(cat VERSION)"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          npm_version="$(node -p "require('./npm/package.json').version")"
          for version in "$core_version" "$desktop_version" "$npm_version"; do
            if [ "$version" != "$tag_version" ]; then
              echo "::error::release versions must all match tag ${GITHUB_REF_NAME} (VERSION=${core_version}, desktop=${desktop_version}, npm=${npm_version})"
              exit 1
            fi
          done

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Verify CLI archives
        run: |
          cd dist
          sha256sum --check checksums.txt
          for archive in wuu_*.tar.gz; do
            tar -tzf "$archive" | grep -Fx "wuu"
          done
          mkdir smoke
          tar -xzf "wuu_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C smoke
          version_output="$(smoke/wuu --version)"
          echo "$version_output"
          echo "$version_output" | grep -F "${GITHUB_REF_NAME}"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::CLI archive was built from a dirty worktree."
            exit 1
          fi

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          desktop_version="$(node -p "require('./package.json').version")"
          core_version="$(cat ../VERSION)"
          if [ "$desktop_version" != "$tag_version" ]; then
            echo "::error::desktop/package.json version ${desktop_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$core_version" != "$tag_version" ]; then
            echo "::error::VERSION ${core_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build desktop release
        run: npm run release:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Verify packaged app
        run: |
          echo "::notice::macOS desktop artifacts are unsigned preview builds; users may need to remove Gatekeeper quarantine after installing."

          version_output="$(release/mac-arm64/wuu.app/Contents/Resources/bin/wuu --version)"
          echo "$version_output"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::Packaged core was built from a dirty worktree."
            exit 1
          fi

          cua_helper="release/mac-arm64/wuu.app/Contents/Resources/bin/wuu-cua-mac"
          if [ -e "$cua_helper" ]; then
            echo "::error::Packaged app must not include the internal CUA helper."
            exit 1
          fi

          if plutil -extract NSScreenCaptureUsageDescription raw -o - release/mac-arm64/wuu.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::Packaged app must not include the CUA screen-capture permission declaration."
            exit 1
          fi

          hdiutil verify release/wuu-*-mac-arm64.dmg
          unzip -t release/wuu-*-mac-arm64.zip >/tmp/wuu-desktop-zip-test.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: GitHub Release
    needs:
      - cli
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop-release

      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: cli-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '# wuu %s\n\n' "$GITHUB_REF_NAME" > release-notes.md
          cat >> release-notes.md <<'EOF'
          This release contains command-line archives for macOS and Linux on
          amd64 and arm64, plus an unsigned macOS arm64 desktop preview.

          CLI archives:

          - `wuu_<version>_<os>_<arch>.tar.gz`
          - `checksums.txt`

          Desktop preview:

          - `wuu-<version>-mac-arm64.dmg`
          - `wuu-<version>-mac-arm64.zip`

          The app is not signed or notarized yet. After moving `wuu.app` to `/Applications`, macOS may block it. For a release asset you trust, remove the quarantine attribute:

          ```bash
          xattr -dr com.apple.quarantine /Applications/wuu.app
          open /Applications/wuu.app
          ```

          EOF

          gh release create "$GITHUB_REF_NAME" cli-release/* desktop-release/* \
            --verify-tag \
            --title "wuu ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
