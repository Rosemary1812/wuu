name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop-macos:
    name: Desktop macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          desktop_version="$(node -p "require('./package.json').version")"
          core_version="$(cat ../VERSION)"
          if [ "$desktop_version" != "$tag_version" ]; then
            echo "::error::desktop/package.json version ${desktop_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$core_version" != "$tag_version" ]; then
            echo "::error::VERSION ${core_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build desktop release
        run: npm run release:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged app
        run: |
          echo "::notice::macOS desktop artifacts are unsigned preview builds; users may need to remove Gatekeeper quarantine after installing."

          version_output="$(release/mac-arm64/wuu.app/Contents/Resources/bin/wuu --version)"
          echo "$version_output"
          if echo "$version_output" | grep -q dirty; then
            echo "::error::Packaged core was built from a dirty worktree."
            exit 1
          fi

          hdiutil verify release/wuu-*-mac-arm64.dmg
          unzip -t release/wuu-*-mac-arm64.zip >/tmp/wuu-desktop-zip-test.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
          if-no-files-found: error

  release:
    name: CLI and GitHub Release
    needs: desktop-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: desktop-release

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Upload desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" desktop-release/* --clobber
