name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check repository metadata
        run: make repository-check

  go-check:
    name: Go check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check, test, and build
        run: make check-go test-go build-go

  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --prefix desktop

      - name: Check, test, and build
        run: make check-desktop test-desktop build-desktop

  clients-check:
    name: Clients check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            clients/core/package-lock.json
            clients/mobile/package-lock.json
            packages/protocol/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix clients/core &
          npm ci --prefix clients/mobile &
          npm ci --prefix packages/protocol &
          wait

      - name: Check, test, and export
        run: make check-clients test-clients build-clients

  macos-check:
    name: macOS native check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci --prefix desktop

      - name: Test native helper
        run: make test-native

      - name: Package macOS app
        run: make build-macos
